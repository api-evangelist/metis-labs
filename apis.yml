name: Metis Labs
description: Metis Labs Limited is a London-based industrial AI company founded in 2017
  by Alex Appelbe and Bashir Beikzadeh (an Entrepreneur First EF8 alumnus and a Speedinvest
  portfolio company). Its product, Kelvin Analytics, is an intelligent factory-optimization
  platform that applies reinforcement machine-learning to real-time monitoring and
  predictive analysis, helping process manufacturers in consumer-packaged chemicals,
  food and beverage, and construction materials cut production-line waste, raise product
  quality, and improve throughput. Metis Labs was acquired by Ascalia in September
  2024. No public API, developer portal, or documentation surface is currently published.
